# docker-compose.coolify-local.yml — local smoke test for the
# CANONICAL Coolify image (Dockerfile.coolify), so build/runtime
# regressions surface before pushing to a Coolify server.
#
# Unlike docker-compose.fly-local.yml, build context is THIS
# directory (Coolify Base Directory = dev-pulse/, see
# COOLIFY-SCOPE.md §2.1) — `starter` resolves via the git submodule
# at ./starter, not a sibling checkout. Run `git submodule update
# --init` first if you haven't already.
#
# Usage:
#   make coolify-local          # build + up
#   make coolify-local-down     # stop, keep volumes
#   make coolify-local-reset    # stop + wipe volumes
#   make coolify-local-logs     # tail
#
# No bundled Postgres in the image (§2.3) — this compose file plays
# the role Coolify's managed Postgres resource plays in production.

name: dev-pulse-coolify-local

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.coolify
    image: dev-pulse-coolify:local
    container_name: dev-pulse-coolify-local-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DP_PUBLIC_BASE_URL: http://localhost:8080

      DATABASE_URL: postgres://dev-pulse:devpass@postgres:5432/dev_pulse

      DP_AUTH_SQLITE_URL: sqlite:/data/auth.db?mode=rwc

      DP_SCHEDULER_ENABLE: "false"

      RUST_LOG: info,dev_pulse=info,dp_server=debug,sqlx=warn

      # Secrets sourced from .env (gitignored) — same vars as fly-local.
      DP_GITHUB_OAUTH_CLIENT_ID:  ${DP_GITHUB_OAUTH_CLIENT_ID:-}
      OAUTH_GITHUB_CLIENT_SECRET: ${OAUTH_GITHUB_CLIENT_SECRET:-}
      GITHUB_WEBHOOK_SECRET:      ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_PAT:                 ${GITHUB_PAT:-}
      DP_GITHUB_ALLOW_ORGS:       ${DP_GITHUB_ALLOW_ORGS:-[]}
    volumes:
      - app-data:/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: dev-pulse-coolify-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dev-pulse
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: dev_pulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev-pulse -d dev_pulse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  app-data:
    name: dev-pulse-coolify-local-data
  pgdata:
    name: dev-pulse-coolify-local-pgdata
