name: phase-7-frontend-polish
goal: |
  Rewrite the dev-pulse frontend so it actually looks like a shadcn
  + Tailwind v4 app. Phase 7 shipped a functionally complete SPA but
  built almost all layout with raw inline `style={{...}}` (181
  occurrences) instead of using the shadcn primitives from
  `@nube/starter-ui-kit/components/*` and Tailwind utility classes.
  Result: no proper Card surfaces, the three-lens toggle renders
  vertically because it's hand-rolled, no real spacing rhythm, no
  consistent typography. Every shadcn component is available — Card,
  Tabs, Table, Select, Dialog, Alert, Badge, Skeleton, Sheet,
  DropdownMenu, Breadcrumb, Tooltip, Progress — and almost none are
  used. This job is a pure refactor: zero behaviour change, zero new
  features, zero backend changes. Replace inline styles with Tailwind
  utility classes and shadcn components, end up with a UI a designer
  would not be ashamed of. All existing tests (typecheck, Playwright
  smokes including no-leaderboard grep, mock-mode walkthrough) must
  still pass.

stages:
  - 'audit pass — read every file under `frontend/src/`, build a per-file plan: which shadcn components to introduce, which inline styles map to which Tailwind utilities. Output a single `frontend/POLISH-PLAN.md` listing the 181 inline-style occurrences grouped by file, with the target replacement. No code changes yet. Verify the plan against `src/components/error-boundary.tsx`, `src/layout/app-shell.tsx`, `src/auth/login-page.tsx`, and one report page as worked examples so the rest of the rewrite has a template.'
  - 'app shell + layout rewrite — `src/layout/app-shell.tsx` becomes a proper sidebar layout using shadcn `Sheet` for mobile, `Separator`, `Button` ghost variant for nav items with active-state styling, `DropdownMenu` for the user menu. Use Tailwind `grid`, `flex`, `min-h-dvh`, `border-b`, `bg-card`, `text-muted-foreground` etc. No inline `style={{...}}` left in this file. Login page (`src/auth/login-page.tsx`) becomes a centred shadcn `Card` with proper form spacing using `Label` + `Input` + `Button`. Header gains a `Breadcrumb` derived from the current route.'
  - 'reports section rewrite — every report page (user, team, org, home-org-split, freshness) is restructured to use shadcn `Card` / `CardHeader` / `CardTitle` / `CardDescription` / `CardContent` for the section containers. The three-lens toggle becomes a horizontal shadcn `Tabs` (`TabsList` + `TabsTrigger`) — currently it renders vertically because it is hand-rolled with inline styles. Window picker becomes shadcn `Select` for the preset window + `Popover` + calendar for custom range. User/team/org pickers become shadcn `Select` (or `Command` if there are >20 options). The "Data as of" banner becomes a shadcn `Alert` with the freshness icon and a `Badge` for the relative-time delta. The results table uses shadcn `Table` (TableHeader/TableBody/TableRow/TableCell) with proper sorting affordances. The headline is rendered as a proper typography lockup (`text-2xl font-semibold tracking-tight` + supporting copy in `text-muted-foreground`). Trend sparklines stay but get consistent sizing + a tooltip-on-hover. Smoke: the `no-leaderboard` grep still passes; all three lenses still toggle horizontally; window changes still re-run the query.'
  - 'directory + admin rewrite — directory pages (`users`, `orgs`, `teams`, `home-org`) move to shadcn `Card` containers with `Input` search using `InputGroup` for the search icon, results in shadcn `Table`. Home-org assignment dialog becomes a proper shadcn `Dialog` with `DialogHeader`/`DialogFooter`/`DialogTrigger` and form composition. Admin runs page uses shadcn `Table` with status `Badge` per row (success/partial/error colour-coded via `variant`). Refresh page uses shadcn `Alert` for the loading/error/success states. User anonymise becomes shadcn `AlertDialog` (destructive variant) with the explicit confirmation pattern. User export uses shadcn `Button` with a `Progress` indicator during the streamed download. Smoke: every mutation still works in mock mode; admin pages render without `style={{}}` survivors.'
  - 'theme + polish pass — `src/globals.css` keeps the `@import "@nube/starter-ui-kit/styles.css"` line and the table-mobile-scroll rule but drops the redundant `body { font-family ... }` block (shadcn already sets `--font-sans`). Apply `font-sans antialiased` on the body via Tailwind. Add `@source "../src"` to `globals.css` if needed so Tailwind v4 sees consumer files. Dark mode toggle (`src/components/theme-toggle.tsx`) uses the shadcn `DropdownMenu` with system/light/dark variants. Empty states use shadcn `Empty` component. Loading states use shadcn `Skeleton` with realistic shapes (not just rectangles). Error boundary uses shadcn `Alert` (destructive variant) + retry `Button`. 404 page uses centred `Card` with the missing-route in a `Code` block. Verify: every `style={{` in `frontend/src/` is either gone or has a comment explaining why (e.g. dynamic colour for a sparkline data point). The audit grep `grep -rn "style={{" frontend/src/ | wc -l` reports < 15 (down from 181).'
  - 'REVIEW — full visual walkthrough of every page in mock mode (light + dark). Compare side-by-side with the starter notes example. Document any remaining rough edges in `frontend/POLISH-PLAN.md` so they are visible, not silently shipped.'
  - 'tests + verification — `pnpm typecheck`, `pnpm build` (dist still < 2MB gzipped, the stage-11 gate), `pnpm test:e2e` (all Playwright smokes still pass including login + lens toggle + admin + no-leaderboard grep). Add one new visual-regression smoke: every report page renders with at least one `<Card>` and at least one shadcn `<Tabs>` (so a future regression that strips them trips immediately). `scripts/check-boundaries.sh` still green — no backend changes. Final inline-style audit reports < 15 survivors with comments.'
