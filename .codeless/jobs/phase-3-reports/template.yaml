name: phase-3-reports
goal: |
  Ship Phase 3 of dev-pulse per TODO.md — the report query layer in
  dp-reports that consumes the Phase 1 schema (activity_events +
  event_actors + memberships) populated by the Phase 2 ingestion
  layer. Every report accepts one envelope (orgs, users, teams,
  window, scope_mode, group_by, activity_types, actor_roles),
  resolves Window from (label, tz, anchor) server-side per §0.4
  echoing the resolved UTC start/end back in the response,
  implements the three org-scope lenses from SCOPE §8.1 with
  (user_id, event_id)-pair de-duplication in the all-orgs-combined
  lens (§0.2), counts for events filtered by actor_roles + p50/p90/p95
  for durations via percentile_cont (no means), surfaces a per-response
  data_as_of object {webhook_latest, reconciler_latest, per_org: {…}}
  per §0.3, and is gated by a spot-check fixture harness that compares
  our numbers to recorded GitHub responses (SCOPE §11.4 trust
  requirement). All work in dp-reports — zero starter_* imports
  (§0.6 R-boundary), no dp-rest / dp-mcp / dp-cli surface work
  (Phase 4+).

stages:
  - 'lock Phase 3 open questions before code lands — confirm the report envelope shape (orgs/users/teams/window/scope_mode/group_by/activity_types/actor_roles) is final for v1 so Phase 4 handlers and Phase 5 MCP tools can mirror it verbatim, confirm the role→metric mapping table (commits authored → role IN (author, co_author); PRs reviewed → role = reviewer; issues commented → role = commenter; etc.) so every metric has exactly one filter, confirm the trend bucket granularity (day-bucket for windows ≤ 31 days, week-bucket for 32–183 days, month-bucket beyond — UTC-truncated then re-anchored to the window TZ for labelling), confirm percentile semantics (percentile_cont in Postgres, NULL when sample size < 5 so noisy windows do not render misleading p95s). The §0 decisions in TODO are read-only inputs. Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions and metric mapping before any code lands'
  - 'report envelope + Window resolution in dp-reports::envelope — the ReportRequest struct (orgs, users, teams, window_spec, scope_mode, group_by, activity_types, actor_roles) and the WindowSpec (label, tz, anchor, custom_start, custom_end) types, plus resolve_window(spec) → Window that turns (label, tz, anchor) into a concrete UTC [start, end) per §0.4. The viewer/org/utc anchor matrix is exercised by table-driven unit tests (cross-DST boundary, year-end, leap day). All types live in dp-reports; zero starter_* imports (R-boundary). The Window type itself is re-used from dp-domain::window (already exists from Phase 1)'
  - 'three org-scope lenses in dp-reports::lenses — single-org, all-orgs-combined, per-org-split (SCOPE §8.1). The single-org lens filters event_actor rows to one org. The all-orgs-combined lens unions across orgs and de-dupes on (user_id, event_id) pairs so a co-authored commit spanning two orgs counts once per user (R-events §0.2). The per-org-split lens groups by (user_id, org_id) so context-switching is visible. Each lens is a pure function over Vec<EventActorRow> (the Phase 1 store projection) — no SQL here, the store call is one list_event_actor_rows_in_window. Fixture tests cover the cross-org co-author case explicitly (the SCOPE §11.4 trust regression test)'
  - 'aggregation layer in dp-reports::aggregate — counts for discrete events (filtered by actor_roles per metric; the role→metric mapping table from stage 1 lives here as a const), and p50/p90/p95 percentiles for duration metrics (review turnaround time, time-to-first-review, time-to-merge) computed via a single SQL helper that calls percentile_cont. No means anywhere (SCOPE §6 — long-tail distortion). Sample-size guard: percentiles return None when n < 5 so the UI can render `—` instead of a misleading number. Group_by buckets (per-user / per-team / per-repo / per-day / per-week / per-month) live here; the trend bucket granularity follows the stage-1 decision (day ≤ 31d, week 32–183d, month > 183d)'
  - 'data_as_of envelope in dp-reports::freshness — every report response carries a DataAsOf {webhook_latest: Option<DateTime<Utc>>, reconciler_latest: Option<DateTime<Utc>>, per_org: HashMap<Uuid, DateTime<Utc>>} object computed from fetch_runs (latest finished row per kind, latest per-org reconciler tick). The UI picks which to render per lens (SCOPE §11.7) — single-org → per_org[that org]; all-orgs-combined → min(per_org.values()); per-org-split → per row. This stage adds the store method (extends Store trait + dp-store-pg impl) since Phase 1 did not need it. Boundary check stays green — the new method goes through dp-domain::store::Store like every other store call'
  - 'REVIEW report layer end-to-end against fixtures — the three lenses produce correct numbers on the co-author cross-org fixture (the SCOPE §11.4 trust gate), counts + percentiles match expected values for the seven canonical metrics (commits authored, PRs opened, PRs merged, reviews given, issues opened, review turnaround p50/p90, time-to-merge p50/p90), data_as_of echoes the right per-org and combined timestamps, the resolved Window echoes back with anchor preserved. Phase 4 wires these into dp-rest next; gating here costs less than rewinding from Phase 4 with a lens bug'
  - 'spot-check fixture harness in dp-reports/tests — fixtures under crates/dp-reports/tests/fixtures/ pairing a recorded GitHub API response with the expected dp-reports output. At least three fixtures: single-user-single-org (sanity), co-authored-commit-spanning-two-orgs (the SCOPE §11.4 + §0.2 regression), home-org-split-on-shared-org (the cross-company executive use case from SCOPE §7). Each fixture is one JSON file plus one test that loads it, runs the report pipeline against an in-memory store seeded from the recorded payload, and asserts numbers within tolerance. This is the merge gate for Phase 3'
  - 'Phase 3 smoke tests pass in CI — resolved-window-echoes-back-with-anchor-preserved, three-lens-numbers-correct-on-co-author-fixture (single-org / all-orgs-combined / per-org-split all distinct, de-dup correct on combined), percentile_cont-returns-none-when-sample-under-five, percentiles-match-expected-on-recorded-fixture, data_as_of-per-org-and-combined-match-fetch_runs, boundary-check-still-green (scripts/check-boundaries.sh — zero starter_* imports in dp-reports), no-means-anywhere (grep guard: grep -rn "avg\\|mean" crates/dp-reports/src | grep -v "// not used" yields no hits in metric code)'
