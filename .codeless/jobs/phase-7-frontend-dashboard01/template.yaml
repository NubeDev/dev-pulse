name: phase-7-frontend-dashboard01
goal: |
  Rebuild the dev-pulse frontend layout around the official shadcn
  `dashboard-01` block. The previous Apple-aesthetic run lifted the
  codeless-ui tokens and font but kept the same hand-rolled layout
  shape, so it still reads as "plain page with cards" instead of "a
  shadcn dashboard". This run installs the actual block and adopts
  its components verbatim: `app-sidebar`, `site-header`,
  `nav-main` / `nav-secondary` / `nav-user`, `section-cards`,
  `chart-area-interactive`, `data-table` with the segmented `Tabs`
  toolbar. Then we map dev-pulse content (reports, directory, admin)
  onto those primitives.

  Zero behaviour change. Zero new features. Zero backend changes.
  Pure presentation overhaul. Existing route shapes, query keys,
  RPCs, mock-mode, and Playwright contracts stay untouched.

stages:
  - 'install the block — from `frontend/`, run `pnpm dlx shadcn@latest init` if `components.json` is missing (use Tailwind v4 preset, slate base colour, src/ alias `@/*` → `src/*`), then `pnpm dlx shadcn@latest add dashboard-01 --overwrite`. This generates `src/components/app-sidebar.tsx`, `site-header.tsx`, `nav-main.tsx`, `nav-secondary.tsx`, `nav-user.tsx`, `nav-documents.tsx`, `section-cards.tsx`, `chart-area-interactive.tsx`, `data-table.tsx`, and adds any missing shadcn primitives (`sidebar`, `chart`, `toggle-group`, etc.) into `src/components/ui/`. Reconcile with what already exists: keep our `globals.css` token block (from the Apple run, it lifts codeless-ui oklch), but accept the block''s components verbatim. Wire the block''s example data into a throwaway `/_blocks/dashboard-01` route so we can compare side-by-side with the real pages while migrating. Stage gate: `pnpm typecheck`, `pnpm build`, `pnpm test:e2e` (existing smokes green), `scripts/check-boundaries.sh` green.'
  - 'adopt the shell — replace `src/layout/app-shell.tsx` with `dashboard-01`''s `SidebarProvider` + `AppSidebar` + `SidebarInset` + `SiteHeader` pattern. Map dev-pulse nav into `nav-main` (Reports, Directory, Admin as top-level groups with section icons; sub-items via collapsible groups — Reports → User/Team/Org/Home-org split/Freshness; Directory → Users/Orgs/Teams/Home-org; Admin → Runs/Refresh). User menu in the bottom `NavUser` block (from `/auth/me`). Header gets the existing Breadcrumb derived from route. Light/dark toggle moves into the header right slot (replace the inline button). No inline `style={{...}}` left in the shell. Stage gate identical.'
  - 'reports onto the block — every report page (user/team/org/home-org-split/freshness) is restructured as: page heading lockup → `SectionCards` row of 3-4 KPI cards showing the headline numbers (PRs opened/merged/closed/comments etc.) with the existing sparkline data feeding mini trend deltas inside each card (use the block''s Badge + trending-up/down icon pattern verbatim) → an `Activity over time` Card containing `ChartAreaInteractive` fed by the same trend series the table already uses (existing data, no new RPC) → a `Breakdown` Card containing `DataTable` (from the block) where rows are the activity-type rows and columns are Type / Total / Trend. The three-lens toggle becomes the `DataTable`''s `Tabs` toolbar (segmented at the top of the table, NOT a separate widget). Filter row (Window / Time zone / Anchor / Entity picker) sits above the SectionCards inside a single Card using `grid grid-cols-1 md:grid-cols-4 gap-4` with `Label`+`Select` pairs. Freshness `Alert` lives between filter Card and SectionCards. Mock-mode + Playwright smokes still pass (lens toggle still cycles horizontally, no-leaderboard grep still empty).'
  - 'directory + admin onto the block — directory pages (users/orgs/teams/home-org) use the same `DataTable` from the block with `InputGroup` search above and shadcn `Badge` chips for filters. Home-org assignment stays a `Dialog`. Admin runs page uses `DataTable` with status `Badge` per row. Admin refresh page uses one `SectionCards` row (Last run / Next run / Last status) + an `Alert` for the trigger result. User anonymise = `AlertDialog` destructive variant. User export = `Button` + `Progress`. Login page = centred `Card` (unchanged from Apple run, just verify it still fits the new tokens).'
  - 'final sweep — 404 + error boundary + theme toggle polished to the block''s sensibility. Empty states use shadcn `Empty`. Loading uses `Skeleton` shapes that match the SectionCards + DataTable layout. Verify dark mode on every route. Audit: `grep -rn "style={{" frontend/src/ | wc -l` must report < 10 with justifying comments on survivors. Remove the throwaway `/_blocks/dashboard-01` demo route. Drop any now-unused components from the old shell.'
  - 'REVIEW — full visual walkthrough light + dark, every route. Capture screenshots of: login, sidebar+header chrome, each report page (User/Team/Org/HomeOrgSplit/Freshness), each directory page, each admin page. Drop them in `frontend/REVIEW-screenshots/` (gitignored). Open the shadcn dashboard-01 demo (https://ui.shadcn.com/blocks → dashboard-01) and a real dev-pulse page side-by-side. Family resemblance: same sidebar, same header chrome, same SectionCards rhythm, same DataTable density. Document any remaining gap in handover.md.'
  - 'tests + verification — `pnpm typecheck`, `pnpm build` (dist < 2MB gzipped), `pnpm test:e2e` (login, lens toggle horizontal cycle inside the DataTable toolbar, window change, admin refresh, no-leaderboard grep). Extend the visual-regression smoke to also assert presence of `[data-slot="sidebar"]` and at least one `[data-slot="section-cards"]` (or equivalent) per report page. `scripts/check-boundaries.sh` green. Final inline-style audit < 10 with comments.'
