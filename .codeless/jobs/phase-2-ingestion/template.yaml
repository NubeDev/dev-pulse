name: phase-2-ingestion
goal: 'Ship Phase 2 of dev-pulse per TODO.md — the ingestion layer that replaces the original scheduled-fetcher model (SCOPE §10) with webhooks-primary plus a reconciler that catches misses, and a bounded backfill. Webhook receiver validates HMAC and enqueues to webhook_inbox in under 100ms; a worker drains the inbox, applies idempotent upserts via external_id, and fans out multi-actor events into event_actors per §0.2; the reconciler runs every 4h with per-(org, repo, resource_kind) cursors and etag conditional GETs (§0.3) to find missed webhooks; backfill is a one-shot per-org bounded window (90 days default) paced against rate limits. Co-author / squash-merge / bot / unattributed handling per SCOPE §6 with explicit fixture-driven unit tests. All work in dp-fetcher, dp-store-pg, and the dev-pulse main.rs — zero edits to crates/starter-* or packages/ per §0.6 boundary rule, enforced by scripts/check-boundaries.sh in CI from Phase 0.'

stages:
  - 'lock Phase 2 open questions before code lands — confirm GitHub App over PAT (TODO §6, working assumption; the App is what unlocks webhook delivery + per-org install + the per-installation token used for octocrab), confirm the backfill 90-day default (TODO §6, revisit after first target deployment), pin webhook HMAC secret storage in starter-secrets-file with a documented rotation path (delivery_id replay survives rotation; in-flight signatures fail-closed on cutover), pin octocrab rate-limit headroom thresholds (default: pause until reset when remaining < 100 across the primary + secondary buckets; record the threshold in dp-config). Plus the §0 decisions already locked in TODO are read-only inputs for this phase — they do not get re-opened here. Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions and §0 inputs before any code lands'
  - 'octocrab client wrapper in dp-fetcher::client — one place that respects X-RateLimit-Remaining / X-RateLimit-Reset and the secondary rate-limit headers, plus conditional GETs via etag from fetch_cursors (§0.3); exposes typed methods reconciler and backfill call (no raw octocrab usage elsewhere in dp-fetcher); hands out a per-installation token via the GitHub App credentials resolved from starter-secrets-file; wiremock-backed tests for happy / 304 / 401 / 403-secondary-rate / 429 / 5xx; boundary check passes (no starter_* imports beyond starter_spi::MigrationSource in dp-store-pg)'
  - 'webhook receiver in dp-fetcher::webhook — axum Router fragment merged by dp-server, route POST /webhooks/github, HMAC SHA-256 validation against the rotation-aware secret resolved from starter-secrets-file (constant-time compare, fail-closed on missing header), enqueue to webhook_inbox with delivery_id as the unique key so GitHub redeliveries are deduped at the inbox boundary, return 200 in under 100ms (the worker does the work). The route is deliberately NOT wrapped in with_principal per TODO §4 — auth is HMAC. Structured tracing with stable webhook.delivery_id field; latency histogram on receipt-to-200 registered against the prometheus::Registry'
  - 'webhook worker in dp-fetcher::webhook — drains webhook_inbox via claim_webhooks (advisory-lock pattern so concurrent workers do not double-process), applies idempotent upserts keyed by activity_events.external_id, and fans out multi-actor events into event_actors per §0.2 with roles from the union {author, co_author, committer, merger, reviewer, commenter, assignee, requester, closer}. Per-resource-kind handlers for pull_request, pull_request_review, pull_request_review_comment, issues, issue_comment, push (incl. trailer-parsing for Co-authored-by), workflow_run, deployment, release, member, membership, team. Writes a fetch_runs row per drain batch (kind=webhook_worker). Worker exits cooperatively when the cancellation channel from dp-server fires'
  - 'REVIEW webhook path end-to-end — webhook receiver returns 200 fast; worker drains and applies idempotent upserts; webhook replay (same delivery_id twice) results in exactly one upsert; latency histogram + run-log row visible. Reconciler and backfill ride on the same handlers next, so the handlers being right matters before the next stage'
  - 'co-author / squash-merge / bot / unattributed handling per SCOPE §6 — explicit unit tests against recorded GitHub fixture payloads checked in under crates/dp-fetcher/tests/fixtures/. Cases: push event with Co-authored-by: trailers (author + N co_authors emitted), squash-merge PR (author from PR + committer from the merge commit, distinct user ids), bot author (author user id = bot user, role still author — UI suppresses bot rows downstream), unattributed deletion (commit author email matches no known user; emit an unattributed actor row with user_id NULL and role=author so the count stays correct), historical commits backfilled before the author existed in users (lazy upsert_user before add_event_actors). Each case is one fixture file plus one test'
  - 'reconciler in dp-fetcher::reconciler — tokio::time interval (4h default, configurable via starter-config; reconciler.tick_interval), per-(org, repo, resource_kind) cursor read from fetch_cursors (§0.3) using since + etag, conditional GETs through the octocrab client wrapper, diff against local store to find events GitHub has but we do not, apply through the same upsert path the webhook worker uses (zero code duplication). Scheduler uses Mutex<Option<JoinHandle>> for coalescing — overlapping tick triggers no-op while the first is running. fetch-now CLI (dp-cli) and POST /admin/refresh (dp-rest) trigger the same path via a shared do_tick(scope) function. Writes a fetch_runs row per tick (kind=reconciler) and updates fetch_cursors.etag + .since on success'
  - 'backfill in dp-fetcher::backfill — one-shot per-org job invoked by dp-cli backfill and at install time, bounded historical window from dp-config (default 90 days), paced separately from the reconciler so it cannot starve real-time webhook processing of rate-limit budget (separate octocrab client wrapper instance with a lower headroom threshold, or shared with priority). Resumable via fetch_cursors so a crashed backfill picks up where it left off. Writes fetch_runs rows per chunk (kind=backfill) so dp-rest /admin/runs can show progress'
  - 'Phase 2 smoke tests pass in CI — webhook-replay-same-delivery-id-yields-exactly-one-upsert, co-authored-commit-fans-out-to-N-event-actors-rows (per the §6 fixture set), missed-webhook-detected-by-reconciler (drop a webhook on the floor, run a reconciler tick, assert the event appears with the correct multi-actor attribution), backfill-respects-rate-limit-headroom (wiremock returns near-exhaustion headers, backfill pauses then resumes), scheduler-coalesces-overlapping-ticks, boundary-check-still-green (scripts/check-boundaries.sh — zero starter_* imports in dp-domain / dp-fetcher / dp-reports, allowlisted starter_spi::MigrationSource only in dp-store-pg), fetch_runs-row-written-per-batch-per-kind'
