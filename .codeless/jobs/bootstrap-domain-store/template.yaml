name: bootstrap-domain-store
goal: |
  Land Phases 0 and 1 of dev-pulse: a Cargo workspace scaffolded with the
  full crate layout, enforced starter-* import boundaries in CI, and a
  working dp-domain + dp-store-pg pair with all v1 tables, indexes, and
  migrations. End state: cargo test --workspace green, schema applies
  cleanly to a fresh Postgres, boundary script green in CI.

stages:
  - workspace and crate scaffolding — root Cargo.toml, all crates from TODO §2 created with empty lib.rs, starter-* pinned via path deps, tracing::init wired in main.rs
  - boundary enforcement — scripts/check-boundaries.sh landed and wired into a CI job that fails on starter-* imports in dp-domain/dp-fetcher/dp-reports, allowlisted only for dp-store-pg
  - REVIEW crate layout, dependency choices, and boundary script behaviour before any domain code is written
  - dp-domain — entity types (User, Org, Team, Membership, Repo, ActivityEvent, EventActor, FetchRun, FetchCursor, WebhookDelivery, Window) and the Store trait with all v1 methods, zero starter-* imports, unit tests for type round-trips
  - dp-store-pg — Postgres Store impl owning PgPool, query bodies (skeleton if needed), MigrationSource wiring via starter_spi::MigrationSource exposed by sources()
  - schema migrations — every table from TODO §Phase 1 with multi-actor split, soft-delete, fetch_cursors composite PK, webhook_inbox partial index, and all mandatory indexes from §Phase 1; namespaced under migrations/dp/
  - REVIEW schema shape and index coverage against TODO §0.2/§0.3/§0.5 before writing integration tests
  - integration tests — Store trait exercised against a real Postgres (testcontainers or local URL via env), covering upsert/cursor/webhook-inbox/pseudonymise paths
