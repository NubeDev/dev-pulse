name: phase-4-http-auth-openapi
goal: |
  Ship Phase 4 of dev-pulse per TODO.md — the HTTP surface that
  exposes Phase 3's report layer, Phase 2's ingestion run-log, and
  the GDPR admin operations through `dp-rest` handlers wired into
  the `dp-server` composition root. Operator login is GitHub OAuth
  via `starter-auth-oauth` layered on top of the
  `starter-auth-users` session + token surface — first-callback
  auto-provisions the operator row and mints the same `sas_*`
  session local login would; local email+password signup stays
  `SIGNUP_MODE=disabled`. Access is gated by `starter-authz`
  against the operator's GitHub org memberships: a
  `StaticRbacEngine` policy with one allow rule keyed on
  `oauth.github_orgs intersects auth.github.allow_orgs` (the
  allow-list — e.g. `["NubeIO", "ACME"]` — lives in dp-config,
  not the policy file). Out-of-org users get a row (audit) but
  every protected request returns `403 awaiting_access`. Every
  report handler accepts the Phase 3 `ReportRequest` envelope
  verbatim (orgs/users/teams/window_spec/scope_mode/group_by/
  activity_types/actor_roles), echoes the resolved UTC `Window`
  back per §0.4, carries the `data_as_of` object per §0.3 /
  §11.7, and routes through one `with_principal` wrapper (auth)
  + `require_permission(resource, action)` (authz) — except
  `POST /webhooks/github`, which authenticates via HMAC (Phase 2)
  and is deliberately NOT principal-wrapped. Every protected
  handler writes an `audit_log` row per SCOPE §9. OpenAPI is
  utoipa-annotated end-to-end and surfaced through
  `ServerBuilder::with_openapi` so dp-rest owns the document
  (consumer-rules §6.7). Composition lives in `dp-server::build()`:
  `ServerBuilder::new(AppState).merge_router(dp_rest::router())
  .merge_router(starter_auth_users::routes::session_router(...))
  .merge_router(starter_auth_oauth::routes::github_router(...))
  .with_openapi(DevPulseApi::openapi()).with_metrics(...)
  .with_principal(...).with_policy(starter_authz::engine)`.
  All work in dp-rest + dp-server + the dev-pulse bin — zero
  starter_* imports leak into dp-domain / dp-fetcher / dp-reports
  (§0.6 R-boundary), zero edits to `crates/starter-*` or
  `packages/`, zero MCP / CLI / frontend work (Phases 5–7).

stages:
  - 'lock Phase 4 open questions before code lands — confirm operator login is GitHub OAuth via `starter-auth-oauth` (first-callback auto-provisions the operator row in starter-auth-users + mints the standard sas_* session; local email+password signup stays SIGNUP_MODE=disabled; CLI-seeded admin from starter-auth-users::admin::create-admin is the break-glass path), confirm the access gate is `starter-authz` with a `StaticRbacEngine` policy file at `crates/dp-server/policy/dev-pulse.toml` shipping one allow rule keyed on `oauth.github_orgs intersects auth.github.allow_orgs` over `resource = "*", actions = ["*"]` (the allow-list — ["NubeIO", "ACME"] etc. — lives in dp-config so adding an org is a config bump not a code change; out-of-org users get a row + audit row but every protected request returns 403 awaiting_access), confirm the `with_principal` + `require_permission` boundary covers every route except POST /webhooks/github (HMAC) and the OAuth login/callback + starter-auth-users session routes (authenticate themselves), confirm the audit_log action vocabulary for the v1 surface (report.read, home_org.set, admin.refresh, user.anonymise, user.export, runs.list, auth.signed_in, auth.denied_org — the last for out-of-org login denials so leaked-invite-style abuse shows up in the audit trail), confirm the OpenAPI surface is one `#[derive(OpenApi)] DevPulseApi` aggregating every utoipa-annotated handler in dp-rest plus utoipa::path shims for the OAuth + session routes mounted from starter crates so the published doc has one origin per consumer-rules §6.7. The §0 decisions in TODO are read-only inputs. Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions before any code lands'
  - 'report handlers in dp-rest::reports — `GET /reports/user/:user_id`, `GET /reports/team/:team_id`, `GET /reports/org/:org_id`, `GET /reports/home-org-split`, `GET /reports/freshness`. Each handler takes the Phase 3 `ReportRequest` envelope (deserialised from query + path params), calls into `dp-reports` for the data, returns a `ReportResponse { resolved_window, rows, data_as_of }` per §0.4 + §11.7. Handlers are `async fn(State<AppState>, Query<…>, Path<…>) -> Result<Json<ReportResponse>, ApiError>`. utoipa-annotated with `#[utoipa::path(...)]` so DevPulseApi picks them up. No `starter_*` imports in dp-reports (R-boundary); the handler crate (dp-rest) is allowed to import starter (it is an edge crate per §0.6). Unit tests assert the resolved window echoes back unchanged and data_as_of is present on every shape'
  - 'directory handlers + home-org mutation in dp-rest::directory — `GET /users` (list users with optional org filter), `GET /orgs` (list orgs the principal can see), `GET /teams` (list teams within an org), `POST /home-org` (body: `{user_id, org_id}` — sets `memberships.home_org = true` for that (user, org), clears the previous home org). Each protected handler writes an `audit_log` row with the action vocabulary from stage 1. Unit tests use an in-memory `Store` impl and a stub principal to assert the audit row lands and the home-org flip is atomic (only one `home_org = true` per user)'
  - 'admin handlers in dp-rest::admin — `POST /admin/refresh` already exists from Phase 2 stage 8; this stage adds `GET /admin/runs` (paginated `fetch_runs` projection — kind / started / finished / items / errors / partial), `POST /admin/users/:id/anonymise` (calls `Store::pseudonymise_user`, writes audit_log `user.anonymise`), `GET /admin/users/:id/export` (joins users → memberships → event_actors → events, streams JSON dump per SCOPE §9 — chunked so a 500MB export does not OOM the process, writes audit_log `user.export`). All three sit behind `with_principal` and require operator role. The existing `POST /admin/refresh` is updated to also emit an `audit_log` row (it did not in Phase 2). Unit tests cover the streaming export shape and the pseudonymisation cascade'
  - 'OpenAPI aggregation in dp-rest::openapi — `#[derive(OpenApi)] struct DevPulseApi` listing every utoipa-annotated handler from stages 3–5 plus the Phase 2 webhook receiver, plus every request/response struct in the `components(schemas(...))` list. Re-exports `DevPulseApi::openapi()` for `dp-server` to hand to `ServerBuilder::with_openapi`. A snapshot test pins the OpenAPI JSON to `tests/openapi.snapshot.json` so accidental schema drift surfaces as a failing test, not a silent breaking change for Phase 5 MCP / Phase 7 frontend clients. The snapshot is regenerated by `cargo test -- --update-openapi-snapshot`'
  - 'REVIEW dp-rest surface end-to-end before composing into dp-server — every handler returns the expected shape (resolved Window echoes back on report responses, data_as_of present, audit_log written), `with_principal` covers everything except `/webhooks/github` and the auth session routes, OpenAPI snapshot is stable. The composition stage that follows wires it together; gating here costs less than rewinding from stage 8'
  - 'dp-server composition root in dp-server::build — `AppState` carries `Arc<dyn Store>`, `Arc<Scheduler>`, `Arc<dyn Authenticator>`, `Arc<dyn PolicyEngine>`, `Arc<HmacSecret>` (webhook secret from starter-secrets-file), `Arc<Registry>` (prometheus). `build(config) -> Result<Router, BuildError>` constructs `ServerBuilder::new(state).merge_router(dp_rest::router()).merge_router(dp_rest::admin_router()).merge_router(dp_rest::reports_router()).merge_router(dp_fetcher::webhook::router()).merge_router(starter_auth_users::routes::session_router(auth.clone())).merge_router(starter_auth_oauth::routes::github_router(oauth_provider.clone())).with_openapi(DevPulseApi::openapi()).with_metrics(registry.clone()).with_principal(auth.clone(), &["/reports/*", "/users", "/orgs", "/teams", "/home-org", "/admin/*"]).build()`. The webhook router is explicitly excluded from `with_principal` (HMAC). OAuth login + callback and auth session routes authenticate themselves. dp-server is the only crate that imports `starter_server`, `starter_auth_users`, `starter_auth_oauth`, `starter_authz`, and the other starter composition pieces — dp-rest stays edge-allowed but does not depend on a specific Authenticator / PolicyEngine impl'
  - 'GitHub OAuth + authz wiring in dp-server::auth — mount `starter-auth-oauth` with the GitHub provider (client_id, client_secret resolved via starter-secrets-file from dp-config `[auth.github]`); add the `github_orgs` attribute stamper that calls `GET /user/orgs` via the same octocrab client wrapper Phase 2 already paces (one call per session mint, cached on the session row, refreshed lazily per `auth.github.org_refresh_interval` default 1h), writes the resulting org login list into `Principal.extra.oauth.github_orgs` per starter-authz R8 attribute-bus convention; load `starter-authz::StaticRbacEngine` at boot from `crates/dp-server/policy/dev-pulse.toml` (one allow rule keyed on `oauth.github_orgs intersects auth.github.allow_orgs` over `resource = "*", actions = ["*"]`, plus the built-in role defaults from authz R7); decorate every protected route in dp-rest with `require_permission(<resource>, <action>)` so a forgotten decoration trips the require_permission-covers-every-protected-route smoke; out-of-org users get a row + `auth.denied_org` audit entry but every protected request returns `403 awaiting_access`. Boundary check stays green — the starter-* imports are confined to dp-server which is edge-allowed per §0.6'
  - 'main.rs wires the bin — extends `dev-pulse/src/main.rs` so `serve` calls `dp_server::build(config).await?` instead of the Phase 2 stub, mounts the resulting Router on the address from `dp-config`, registers cooperative shutdown so the webhook worker + reconciler scheduler from Phase 2 stop with the server, ensures the `[auth.github]` config block (client_id, client_secret secret://, allow_orgs Vec<String>, org_refresh_interval Duration default 1h) is loaded before `dp_server::build` runs. The clap top-level (`migrate | serve | fetch-now | backfill | claim | <registry>`) is unchanged — Phase 6 owns CLI registrations. Phase 4 changes the `serve` body only. Smoke: `dev-pulse serve --config test.toml` boots against a test Postgres, `curl /openapi.json` returns the DevPulseApi document, `curl /auth/oauth/github/login` 302s to GitHub, callback against a stubbed provider mints a session with `oauth.github_orgs` populated, an in-org `curl -H "Cookie: ..." /reports/user/:id?...` returns a ReportResponse with data_as_of populated and an out-of-org user gets 403 awaiting_access'
  - 'Phase 4 smoke tests pass in CI — github-oauth-callback-mints-session-and-stamps-orgs (stub the GitHub OAuth provider + GET /user/orgs, drive the callback, assert sas_* cookie + Principal.extra.oauth.github_orgs), out-of-org-github-user-signs-in-but-cannot-read-reports (session minted, user row exists, GET /reports/user/:id returns 403 awaiting_access, auth.denied_org audit row written), in-org-github-user-can-read-reports (same flow, org list intersects allow_orgs, returns 200 with populated ReportResponse), report-handler-echoes-resolved-window-and-data_as_of (every report shape carries both), webhooks-github-not-principal-wrapped-but-rejects-bad-hmac (the route is reachable without a session cookie but rejects a bad signature with 401), audit_log-row-written-per-protected-handler (table-driven across the v1 action vocabulary), openapi-snapshot-stable (regenerate only with `--update-openapi-snapshot`, accidental drift fails the test), with_principal-covers-every-non-webhook-non-auth-route (a request without a session cookie to any other route returns 401), require_permission-covers-every-protected-route (a valid session with empty oauth.github_orgs returns 403 on every authz-gated route — a forgotten require_permission decoration trips this), boundary-check-still-green (scripts/check-boundaries.sh — no new starter_* imports in dp-domain / dp-fetcher / dp-reports, only `starter_spi::MigrationSource` in dp-store-pg), admin-user-export-streams-without-OOM (a synthetic 100k-event user exports under a fixed memory budget)'
