name: phase-7-frontend-apple
goal: |
  Make the dev-pulse frontend look like the codeless-ui reference app
  at `/home/user/code/rust/codeless-workspace/codeless/ui/codeless-ui`
  — modern shadcn/ui with an Apple-grade visual rhythm. The previous
  Phase 7 + Phase 7 Polish runs left the SPA functional but visually
  raw: oversized dark panels, capsule "pill" tabs, no card surfaces,
  no spacing rhythm, no refined typography. This run is a single,
  decisive visual overhaul. Zero behaviour change, zero new features,
  zero backend changes — only the surface.

  The bar: open the rebuilt dev-pulse next to codeless-ui in two
  browser windows and they should feel like they came from the same
  design team. Same palette family, same radii, same Inter Variable
  rendering, same Card/Sheet rhythm, same sidebar treatment, same
  Table density, same subtle borders, same generous whitespace.

stages:
  - 'study the reference — read `/home/user/code/rust/codeless-workspace/codeless/ui/codeless-ui/src/styles/globals.css` and lift the entire `:root` + `.dark` oklch token block (background, foreground, card, primary, secondary, muted, accent, destructive, border, input, ring, chart-*, sidebar-*) verbatim into `frontend/src/globals.css`. Add the same `@theme inline` block exposing those tokens to Tailwind v4. Add `--font-sans: "Inter Variable", sans-serif;` and `@import "@fontsource-variable/inter";` (add the dep with `pnpm --filter dev-pulse-frontend add @fontsource-variable/inter`). Add the same radius ladder (`--radius: 0.625rem` with `--radius-sm/md/lg/xl/2xl` multipliers). Add `html, body, #root { height: 100% }` and `@layer base { * { @apply border-border outline-ring/50 } body { @apply bg-background text-foreground font-sans } }`. Drop any legacy body font rule. Then read `src/modules/jobs/JobsDashboard.tsx`, `src/modules/jobs/JobRow.tsx`, `src/modules/jobs/JobDetail.tsx`, `src/modules/header/Header.tsx`, and `src/app/App.tsx` from the reference repo to internalise the layout sensibility (Card density, header bar treatment, sidebar nav rows, Sheet for details, Skeleton shapes). No code changes in dev-pulse yet — only globals.css + the font dep.'
  - 'app shell rewrite — `frontend/src/layout/app-shell.tsx` becomes a proper shadcn sidebar layout. Outer: `<div class="min-h-dvh bg-background text-foreground">`. Header: `<header class="sticky top-0 z-40 flex h-14 items-center gap-3 border-b bg-background/80 px-4 backdrop-blur-xl">` with brand on the left (small mark + "dev-pulse" in `font-semibold tracking-tight`), shadcn `Breadcrumb` next to it, spacer, then dark-mode `DropdownMenu` toggle and a user `DropdownMenu` with avatar (Initials in a rounded square, `bg-muted text-muted-foreground`). Body: `<div class="grid grid-cols-[15rem_minmax(0,1fr)]">` (or `Sheet` on mobile). Sidebar: `<nav class="border-r bg-card/40 p-3">` with each item rendered as `<NavLink class="flex items-center gap-2 rounded-md px-3 py-2 text-sm text-muted-foreground transition-colors hover:bg-accent hover:text-foreground data-[active=true]:bg-accent data-[active=true]:text-foreground data-[active=true]:font-medium">`. Main: `<main class="p-6 md:p-8">` with a max-width content column (`max-w-6xl mx-auto`). No inline `style={{...}}` in this file. Match the codeless-ui chrome density exactly — h-14 header, 60-ish px sidebar items, 12-ish px radii.'
  - 'reports rewrite — every report page (user, team, org, home-org-split, freshness) follows the same skeleton: page-heading lockup (`<h1 class="text-2xl font-semibold tracking-tight">` + `<p class="text-muted-foreground">`) → filter Card (Window / Time zone / Anchor / Entity picker, laid out as a responsive grid inside one Card with proper Label+Select pairs) → freshness `Alert` (the "Data as of" banner, with a coloured Badge for the staleness state) → results Card containing horizontal shadcn `Tabs` for the three-lens toggle (`TabsList` + `TabsTrigger`, NOT the current capsule pill thing) and below them a shadcn `Table` (`TableHeader/TableBody/TableRow/TableCell`) with `class="text-sm"`, right-aligned numeric columns (`text-right tabular-nums`), and a final `Trend` column rendering the existing sparkline at a consistent `h-8 w-24`. The lens toggle MUST be the shadcn Tabs default style (segmented background, active tab elevated) — copy the exact JSX shape from `codeless-ui/src/modules/jobs/JobTabs.tsx` if useful. Loading states use `Skeleton` shapes that match the final layout (header skeleton + table-row skeletons), not generic rectangles. Empty states use shadcn `Empty`.'
  - 'directory + admin rewrite — directory pages (`users`, `orgs`, `teams`, `home-org`) use the same heading lockup + filter Card + results Card pattern. Search becomes shadcn `InputGroup` with a leading magnifier icon. Results in shadcn `Table` with row hover (`hover:bg-muted/50 transition-colors`). Home-org assignment is a shadcn `Dialog` with `DialogHeader/DialogFooter`, form inside uses `Label`+`Select`+`Button` with proper spacing (`grid gap-4`). Admin runs page: shadcn `Table`, status column uses shadcn `Badge` with variant per status (success/secondary/destructive). Admin refresh page: shadcn `Alert` (default for idle, default + spinner for loading, default + check for success, destructive for error). User anonymise: shadcn `AlertDialog` (destructive variant, explicit confirm text echo). User export: shadcn `Button` with shadcn `Progress` underneath during the streamed download. Login page: centred shadcn `Card` (max-w-sm) with `CardHeader/CardTitle/CardDescription/CardContent/CardFooter`, `Label`+`Input`+`Button` form.'
  - 'final polish + audit — sweep every remaining surface: 404 page is a centred `Card` with a friendly message and a `Button` back to /. Error boundary uses `Alert` (destructive) + retry `Button`. Theme toggle is a `DropdownMenu` with System/Light/Dark items (matching the codeless-ui pattern). Dark mode: verify every screen renders correctly in dark — borders visible, text contrast adequate, sparklines legible. Light mode: same. Spacing: confirm consistent `gap-6` between major sections, `p-6` inside cards, `p-8` inside the main column on desktop. Typography: every page-level heading is `text-2xl font-semibold tracking-tight`, every section heading is `text-lg font-medium`, every helper line is `text-sm text-muted-foreground`. Audit: `grep -rn "style={{" frontend/src/ | wc -l` must report < 10. Each surviving occurrence has a justifying comment on the line above (typically dynamic sparkline colours). Visual side-by-side diff: open `pnpm dev` (mock mode) AND open the codeless-ui dev server, navigate to comparable surfaces, capture screenshots, and confirm the family resemblance.'
  - 'REVIEW — full visual walkthrough light + dark, every route. Capture screenshots of: login, sidebar+header chrome, each report page (User/Team/Org/HomeOrgSplit/Freshness), each directory page, each admin page. Drop them in `frontend/REVIEW-screenshots/` (gitignored). Compare each to the codeless-ui equivalent and document any remaining gap in handover.md. The gate: would a designer ship this? If not, fix it before the verification stage.'
  - 'tests + verification — `pnpm typecheck`, `pnpm build` (dist < 2MB gzipped), `pnpm test:e2e` (all Phase 7 smokes still green: login, lens toggle horizontal cycling, window picker, admin refresh, no-leaderboard grep). New visual-regression smoke: every report page renders at least one `[data-slot="card"]` and at least one `[data-slot="tabs"]`, AND the body computed `font-family` includes `Inter`, AND `getComputedStyle(document.documentElement).getPropertyValue("--radius")` is `0.625rem`. `scripts/check-boundaries.sh` green (no backend changes). Final inline-style audit < 10 with comments on survivors.'
