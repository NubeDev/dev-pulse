name: triage-slice-2
goal: |
  Land slice 1.5 (P0 inbox bugs) and slice 2 of the Triage workbench
  per linear-projects-idea.md. Multi-identity model with membership
  reconciliation, Teams and People rail entries, issue write handlers
  through the §8.2 CAS path, timeline / sync-status / reports endpoints,
  start-and-due dates with a Projects v2 mirror, OpenAPI registration of
  every new and previously-missing handler, plus matching frontend
  (identity manager, dates UI, bulk inbox, group-by/sort, ⌘K palette,
  resizable splitters, dark-mode polish) and the two tech-debt cleanups
  (dp-fetcher tests, PinDto.label). Everything green via `cargo test`,
  `pnpm typecheck`, `make build`.

stages:
  - slice 1.5 P0 fixes — split `dp_issues.version` from a new `external_version` column (migration 0013, reconciler bumps external only, §8.2 commit path does not), rewrite `list_inbox_issues` to identity-set semantics so it stops returning "all open everywhere", change `POST /me/inbox/seen` wire shape from a bare uuid list to entries of (issue_id, version) pairs with server-side `LEAST(version_seen, current_external_version)`; tests cover own-write-not-unread and the seen-race
  - multi-identity schema + stamper (§3.0) — migration 0014 adds `dp_user_identities` (with `is_primary` partial unique index) and the `dp_membership_identities` provenance join, backfilled from `dp_users.github_id`; extend `GithubOrgsStamper` to stamp set-shaped `Principal.extra.github` with logins, user_ids and orgs as arrays; `principal_dirty` table drives re-stamp on link/unlink without forced re-login; refuse to mint principal when identity set is empty (401 `identity_set_empty`)
  - identity endpoints + CLI + membership reconciliation — wire `GET /me/identities`, `POST /me/identities/link/start` and `/callback` via a server-side nonce table (state never carries the session id per §3.0.2.a), `DELETE /me/identities/by-github-user-id` with last-identity and primary guards, `PATCH .../primary`, admin transfer + admin link verbs, `dev-pulse link-identity` CLI; `identities` resource registered in policy; membership reconciler enforces the §3.0.2.b invariant (a `dp_memberships` row exists iff any provenance row exists for the same user_id and org_id)
  - REVIEW — schema + identity model; confirm migration order (0013 → 0014), deprecation strategy for `dp_users.github_id`, principal cache invalidation path, and the nonce-based OAuth state flow before exposing the write surface
  - triage issue write handlers — mount `issues_write_router` for `POST /issues`, `PATCH /issues/by-id`, `POST /issues/by-id/comments` through the existing `acquire_issue_mutation_slot` then octocrab then commit-or-rollback helpers; gated on `(issues, write)`; CAS miss returns 409 `stale_local_version` per §8.3; integration tests cover happy path, CAS miss, and GitHub-failure rollback with §13.7 buffer drain
  - read-side endpoints — `GET /issues/by-id/timeline` backed by the §6 guarded expression index on `dp_activity_events`; `GET /repos/by-id/sync-status` and `POST /repos/by-id/sync` with the new `(repos, sync)` auth pair; `GET /reports/issues` with the corrected §5.10 SQL (`CROSS JOIN LATERAL jsonb_array_elements_text` for `wip`, `jsonb_array_length(...) = 0` for `untriaged`, `EXTRACT(EPOCH FROM ...)` for `lead_time`); `/me/queue` gets keyset pagination on (updated_at, id) plus per-arm `LIMIT $cap` push-down plus the new covering index `dp_issues_updated_at_idx`
  - dates on issues (§3.10) — migration 0015 adds `dp_issue_dates` (PK issue_id, both dates nullable, `CHECK` that start is null or due is null or start <= due, plus mirror provenance columns) and optional `dp_repo_project_link`; `PATCH /issues/by-id/dates` does a synchronous local upsert; if the repo is linked, enqueue a best-effort GraphQL mirror task (`addProjectV2ItemById` then `updateProjectV2ItemFieldValue`) that records failures in `mirror_error` and never blocks the local save; Projects v2 pull-back stays a slice-3 deferral with a stub task type
  - OpenAPI + audit + bulk inbox — register every new handler (`me_queue`, inbox seen/patch/bulk, identities, write verbs, timeline, sync-status, reports, dates) on `DevPulseApi` and close the slice-1 omission for `list_issues`; add `POST /me/inbox/bulk` for mark-all / snooze-all / done-all; audit vocabulary extended for `IDENTITY_*`, `DATE_SET`, `REPO_SYNC_REQUESTED`, `BULK_INBOX_*`; the `dp_user_issue_state` BEFORE UPDATE trigger from §6 actually ships
  - REVIEW — backend done; confirm OpenAPI surface, policy resource registry (including `identities` and `(repos, sync)`), and migration chain (0013 → 0015) before frontend starts depending on them
  - frontend backbone — identity manager at `#/account/identities` with link / unlink / transfer / set-primary plus a user-menu badge for the active identity set; Teams + People entries in the Triage views rail with People collapsed-by-default to respect the §13.5 sidebar render cap; Untriaged scoped to `dp_memberships` orgs with the 24h age floor; snoozed view backed by `/me/queue?status=snoozed`; bulk inbox actions on selection (shift-E / shift-H / shift-D); group-by + sort dropdowns on the middle pane; ⌘K palette (slice-2 scope — jump-to, view-switch, apply-to-selection)
  - frontend dates + saved views + polish — start_date and due_date pickers in `IssueEditCard`; `Due` column in the list (toggle `g d`); `Due this week` and `Overdue` smart views in the rail with past-due re-bump to inbox; tag-backed saved views as first-class rail entries with counts (§14.6); resizable pane splitters with state in `localStorage`; dark-mode pass on every new surface; `PinDto.label` denormalized server-side (or client-side joined against the repo list) so the rail stops showing `target_id.slice(0, 8)`
  - tech debt + handover — triage the pre-existing `dp-fetcher` test failures noted in §0 (fix in place or quarantine with a tracking issue; CI on `main` must be green); final `cargo test --workspace`, `cd frontend && pnpm typecheck`, and `make build` all green; update §0 progress log with what landed and what was explicitly deferred (Projects v2 pull-back, saved-view CRUD as a separate object, SLA / digest, on-call rotation handoff, mentions ingestion); write the slice-3 brief so the next job picks up cleanly
