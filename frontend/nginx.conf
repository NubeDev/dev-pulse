# Mirrors the dev-server proxy table in vite.config.ts. Routes that
# hit the Rust backend are forwarded to the `backend` service; every
# other path falls back to index.html for SPA client-side routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /auth/         { proxy_pass http://backend:8731; }
    location /reports/      { proxy_pass http://backend:8731; }
    location /directory/    { proxy_pass http://backend:8731; }
    location /admin/        { proxy_pass http://backend:8731; }
    location /health        { proxy_pass http://backend:8731; }
    location /openapi.json  { proxy_pass http://backend:8731; }

    # Product & Manufacturing surfaces (DOCS/ideas/product-manufacturing.md).
    location /products      { proxy_pass http://backend:8731; }
    location /manufacturers { proxy_pass http://backend:8731; }
    location /suppliers     { proxy_pass http://backend:8731; }
    location /customers     { proxy_pass http://backend:8731; }
    location /runs          { proxy_pass http://backend:8731; }
    location /units         { proxy_pass http://backend:8731; }
    location /rma           { proxy_pass http://backend:8731; }
    location /blobs         { proxy_pass http://backend:8731; }
    location /u/            { proxy_pass http://backend:8731; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
