[package]
name        = "dp-rest"
description = "axum Router<AppState> with utoipa-annotated handlers."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
dp-domain   = { workspace = true }
dp-reports  = { workspace = true }
dp-fetcher  = { workspace = true }
# starter-authz is an edge-allowed dep per §0.6 (dp-rest is an
# edge crate). We need `require_permission` to decorate every
# protected route per Phase 4 stage 9 / SCOPE D4.2; the engine
# itself is wired in dp-server::build via Extension.
starter-authz = { workspace = true }
# starter-spi gives us the `BlobStore` trait + `BlobRef` opaque
# handle the exec-summary upload + proxy routes thread through.
# Edge-allowed per §0.6.
starter-spi   = { workspace = true }
# starter-auth-users owns the local-password store (`UserStore`) and
# the argon2 set/change helpers behind `PUT /admin/users/{id}/password`
# and `POST /me/password` (issue #14). Same edge-allowed rationale as
# starter-auth-oauth below: we take the trait + helpers, the concrete
# sqlite/postgres store stays wired in the bin layer.
starter-auth-users = { workspace = true }
# starter-auth-oauth is the source of truth for the OAuth identity
# rows the `/me/identities` surface (§3.0 / §10) projects. We
# import the `IdentityStore` trait + `OAuthIdentity` row shape here
# so the handler can read through whatever sqlite/postgres impl the
# bin layer wires; the engine and providers stay in starter-auth-oauth.
starter-auth-oauth = { workspace = true }
async-trait = { workspace = true }
axum        = { workspace = true }
chrono      = { workspace = true }
chrono-tz   = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true }
tracing     = { workspace = true }
utoipa      = { workspace = true }
uuid        = { workspace = true }
tokio-stream = "0.1"
bytes        = "1"
futures      = { workspace = true }
secrecy      = "0.10"
# Product & Manufacturing (§6): HMAC token for the public unit landing
# + QR SVG generation for the printable label endpoint.
hmac         = "0.12"
sha2         = "0.10"
hex          = "0.4"
qrcode       = { version = "0.14", default-features = false, features = ["svg"] }

[dev-dependencies]
tower         = { version = "0.5", features = ["util"] }
starter-spi   = { workspace = true }
