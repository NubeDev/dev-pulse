# dev-pulse — example deployment config.
#
# Boot via:
#   dev-pulse serve --config /etc/dev-pulse/config.toml
#
# Phase 4 stage 10 wires the `serve` body; Phase 6 wires the rest
# of the CLI (migrate / fetch-now / backfill / claim).

[server]
# The frontend's Vite dev server proxies /auth, /reports, /directory,
# /admin, /health, /openapi.json to localhost:8731 — keep these in
# sync with frontend/vite.config.ts and the Makefile's BACK_PORT.
listen = "127.0.0.1:8731"
base_url = "http://localhost:8731"
default_return_to = "/"

[postgres]
# dp-data lives here — events, memberships, fetch_runs, audit_log.
url = "postgres://dev-pulse:devpass@localhost/dev_pulse"

[auth_sqlite]
# Sidecar SQLite file for starter-auth-users / starter-auth-oauth
# row families (users, sessions, tokens, oauth_identities). Schemas
# applied automatically at boot.
url = "sqlite:./auth.db?mode=rwc"

[webhook]
# `secret://NAME`  → env var NAME (upper-cased, '/' → '_')
# `file:/path`     → file contents (trimmed)
# anything else    → literal value (operational risk on the operator)
secret_ref = "secret://github/webhook_secret"

[auth.github]
client_id = "Iv1.deadbeefcafef00d"
client_secret_ref = "secret://oauth/github_client_secret"
# Allow-listed GitHub org logins; a user whose `GET /user/orgs`
# intersects this list passes the org gate. Case-insensitive.
allow_orgs = ["NubeIO", "ACME"]
# Optional — defaults to 3600 (1h). The TTL the GithubOrgsStamper
# cache wrapper uses; the request hot path never hits GitHub.
org_refresh_interval_secs = 3600

[scheduler]
# Seconds between reconciler ticks. Default 300 (5 min). The
# Scheduler ignores ticks while a previous one is still running, so
# a missed deadline doesn't pile up.
tick_interval_secs = 300
# If `true` *and* `[github].token_ref` resolves to a non-empty value,
# the reconciler tick loop runs on the schedule above. If the token
# is missing, the bin force-overrides this to `false` and logs a
# warning, so a misconfigured deployment doesn't hammer GitHub with
# a token-less client.
enable = false

[github]
# Fetcher-side GitHub credentials. Distinct from `[auth.github]`,
# which is the *operator OAuth* config — this one is the token the
# reconciler and backfill use to call the GitHub REST API.
#
# Per SCOPE §15.1 the v1 production path is a GitHub App. PAT is the
# Phase 6 stepping stone: set `token_ref` to a `secret://` handle
# pointing at a classic / fine-grained PAT to arm the fetcher today.
# Leave commented out (or set to an empty string) to keep the
# fetcher dormant.
token_ref = "secret://github/pat"
# REST API base URL. Override only for GitHub Enterprise or a
# wiremock fixture; the public hostname is the default.
# base_url = "https://api.github.com"
#
# Local per-run request budget — the operator-side fuse against a
# runaway reconciler tick. After this many GitHub HTTP calls in a
# single run, the wrapper returns `BudgetExhausted` and the run
# stops cleanly. `0` disables the fuse (relies on GitHub's own
# 5000 req/h primary bucket). Default 200 — bump once a deployment
# knows its real per-tick cost.
max_requests_per_run = 200
