[package]
name        = "dev-pulse"
description = "dev-pulse top-level binary. main.rs only — clap subcommands compose dp-cli + starter-cli registry."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish = false

[[bin]]
name = "dev-pulse"
path = "src/main.rs"

[dependencies]
# dev-pulse crates — the bin layer pulls them together.
dp-server   = { workspace = true }
dp-fetcher  = { workspace = true }
dp-store-pg = { workspace = true }
dp-domain   = { workspace = true }

# starter crates — `dev-pulse` (the bin) and `dp-server` are the two
# crates allowed to import the starter composition pieces per the
# §0.6 R-boundary. The bin owns concrete-store construction and
# secret resolution; dp-server owns the router composition.
starter-observability  = { workspace = true }
starter-server         = { workspace = true }
starter-spi            = { workspace = true }
starter-store-postgres = { workspace = true }
# `testing` feature pulled in transitively by starter-auth-oauth's
# `pub mod testing` (which is itself feature-gated only on `sqlite`,
# not on a separate testing flag). Until starter splits the testing
# helpers out, consumers wiring the sqlite path need both.
starter-store-sqlite   = { workspace = true, features = ["testing"] }
starter-auth-users     = { workspace = true, features = ["sqlite"] }
starter-auth-oauth     = { workspace = true, features = ["sqlite"] }
starter-authz          = { workspace = true }

# Third-party — Phase 4 stage 10's serve subcommand reads a TOML
# config (`toml`), connects pools, registers prometheus metrics,
# and drives axum::serve with a cooperative shutdown signal.
anyhow      = { workspace = true }
async-trait = { workspace = true }
axum        = { workspace = true }
clap        = { workspace = true }
prometheus  = { workspace = true }
secrecy     = "0.10"
serde       = { workspace = true }
serde_json  = { workspace = true }
sqlx        = { workspace = true, features = ["sqlite", "postgres", "macros", "migrate", "uuid"] }
uuid        = { workspace = true }
tokio       = { workspace = true }
toml        = "0.8"
tracing     = { workspace = true }
